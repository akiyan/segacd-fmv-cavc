schema_version = 5

[source]
path = "assets/bad-apple/bad-apple.mp4"
fps = "30"
duration = "8.000000"
sar = "1:1"

[source.preprocess.endpoint_snap]
black_max = 2
white_min = 253

[video]
width = 320
height = 176
fit = "crop"
resize_filter = "area"
master_denoise = false

[output]
directory = "tmpfs/BadApple_H40_320x176_adpcm22/sim"
reuse = false
emit_decisions = true

[encoder]
cold_cap = 200

[palette]
algorithm = "mosaic-gm"
