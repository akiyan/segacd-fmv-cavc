schema_version = 4

[source]
path = "assets/BadApple.mp4"
fps = "30"
duration = "75.000000"
sar = "1:1"

[source.preprocess.endpoint_snap]
black_max = 2
white_min = 253

[video]
mode = "H40"
width = 320
height = 224
fit = "crop"
resize_filter = "area"
master_denoise = false

[output]
directory = "tmpfs/BadApple_H40_320x224_adpcm22_issue74_75s_cold360/sim"
reuse = false
emit_decisions = true

[encoder]
raw_prefetch = true
cold_cap = 360

[palette]
algorithm = "mosaic-gm"
