schema_version = 5

[source]
path = "assets/bad-apple/bad-apple.mp4"
fps = "30"
duration = "219.213021"
sar = "1:1"

[source.preprocess.endpoint_snap]
black_max = 2
white_min = 253

[video]
width = 320
height = 224
fit = "crop"
# Preserve the qualified Bad Apple image settings; only cold cap changes.
resize_filter = "area"
master_denoise = false
# Preserve gradients while suppressing opposite-colour dots at hard edges.
output_dither = "edge-attenuated-bayer"

[output]
directory = "tmpfs/BadApple_H40_320x224_adpcm22_cold210/sim"
reuse = false
emit_decisions = true

[encoder]
cold_cap = 210

[palette]
algorithm = "mosaic-gm"
