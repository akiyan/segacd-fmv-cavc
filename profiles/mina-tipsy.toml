schema_version = 5

[source]
path = "assets/mina-tipsy/tipsy-original.webm"
fps = "30"
duration = "193.36"
sar = "1:1"

[video]
width = 320
height = 224
fit = "crop"
# Remove the fixed letterbox, then center-crop using H40 PAR 32:35.
# Confirmed at 15, 60, 120 and 170 seconds in the original 4K master.
master_filter = "crop=3840:1944:0:110,setsar=1,crop=2538:1944:651:0,scale=640:448:flags=lanczos,hqdn3d=6:6:8:8,gblur=sigma=1.6,scale=320:224:flags=lanczos"
raw_filter = "crop=3840:1944:0:110,setsar=1,crop=2538:1944:651:0,scale=320:224:flags=lanczos"

[output]
directory = "tmp/mina-tipsy/sim"
reuse = true
emit_decisions = true

[encoder]
cold_cap = 210

[palette]
algorithm = "mosaic-gm"

[analysis]
source_canvas = [320, 224]
source_par = [32, 35]

