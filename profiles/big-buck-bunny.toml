schema_version = 5

[source]
path = "assets/big-buck-bunny/bbb_sunflower_1080p_30fps_normal.mp4"
fps = "30"
# Tune the opening two minutes before extending to the complete film.
duration = "120"
start_frame = 0
end_frame = 3600
sar = "1:1"

[video]
width = 320
height = 224
# Center-crop the sides to fill the aperture, preserving H40 PAR 32:35.
# The visible aperture is 64:49, the console's near-4:3 fullscreen geometry.
fit = "crop"

[output]
directory = "tmp/big-buck-bunny/sim"
reuse = true
emit_decisions = true

[encoder]
cold_cap = 210

[palette]
algorithm = "mosaic-gm"

[analysis]
source_canvas = [320, 224]
source_par = [32, 35]

[release]
title = "Big Buck Bunny — Sega CD disc images"
title_ja = "Big Buck Bunny — Sega CD ディスクイメージ"

[youtube]
playback_title = "Custom Sega CD FMV Codec Demo — Big Buck Bunny Opening 2 Minutes at 30 FPS"
source_label = "Big Buck Bunny, Sunflower version, opening 120 seconds, center-cropped, 1920x1080, 30 fps, 48 kHz audio"
source_label_ja = "Big Buck Bunny、Sunflower版、冒頭120秒、左右中央クロップ、1920x1080、30 fps、48 kHz音声"
