schema_version = 5

[source]
path = "assets/sewer_shark_intro_hd.mkv"
# The 25 fps delivery repeats the underlying approximately 15 fps picture.
# Preserve that picture cadence rather than spending updates on repeats.
fps = "15"
duration = "279.336000"
sar = "1:1"

[video]
width = 320
height = 176
fit = "crop"
resize_filter = "area"
master_denoise = false
# Remove the fixed source borders and squeeze height from 188 to 176 pixels.
# Matching objects measured about 6.7% wider in the original NTSC disc capture.
# 320x176 forms a 40x22 tile grid; H40 PAR remains 32:35.
master_filter = "setsar=1,crop=2224:1424:174:8,scale=320:176:flags=area,setsar=1,format=gbrp,colorlevels=rimin=0.04:gimin=0.04:bimin=0.04,lutrgb=r='255*pow(val/255,1/1.9)':g='255*pow(val/255,1/1.9)':b='255*pow(val/255,1/1.9)',scale=out_range=limited,format=yuv444p,lut=u='clip(floor((val-128)*0.70+128.5),0,255)':v='clip(floor((val-128)*0.70+128.5),0,255)',setsar=1"
raw_filter = "setsar=1,crop=2224:1424:174:8,scale=320:176:flags=area,setsar=1,format=gbrp,colorlevels=rimin=0.04:gimin=0.04:bimin=0.04,lutrgb=r='255*pow(val/255,1/1.9)':g='255*pow(val/255,1/1.9)':b='255*pow(val/255,1/1.9)',scale=out_range=limited,format=yuv444p,lut=u='clip(floor((val-128)*0.70+128.5),0,255)':v='clip(floor((val-128)*0.70+128.5),0,255)',setsar=1"

[output]
directory = "tmpfs/sewer_shark_intro_hd_shadows_H40_320x176_adpcm22/sim"
reuse = false
emit_decisions = true

[encoder]
# Existing 15 fps playback baseline; qualify this source through its HUD gate.
cold_cap = 380

[palette]
algorithm = "mosaic-gm"

[analysis]
source_canvas = [320, 176]
source_par = [32, 35]

[youtube]
analysis_title = "Sega CD FMV at 15 FPS — Sewer Shark Intro Visual Analysis & Encoding Breakdown"
playback_title = "Custom Sega CD FMV Codec Demo — Sewer Shark Intro at 15 FPS"
source_label = "Sewer Shark intro, VGSuite's 3DO-based HD remaster; 2560x1440/25 fps, approximately 15 fps picture cadence; 44.1 kHz stereo; borders removed, 320x176 picture; object proportions matched to the original NTSC disc capture"
source_label_ja = "Sewer Sharkイントロ、VGSuiteによる3DO版のHDリマスター。2560x1440・配信25 fps／映像更新約15 fps、44.1 kHzステレオ。黒縁を除去し映像320x176に調整。NTSCオリジナル版の物体比率に合わせて縦方向を補正"
source_url = "https://www.youtube.com/watch?v=hZwLgB4QOQM"

