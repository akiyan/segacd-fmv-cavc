schema_version = 5

[source]
path = "assets/sewer_shark_intro_hd.mkv"
# The 25 fps delivery repeats the underlying approximately 15 fps picture.
# Preserve that picture cadence rather than spending updates on repeats.
fps = "15"
duration = "279.336000"
sar = "1:1"

[video]
width = 320
height = 184
fit = "crop"
resize_filter = "area"
master_denoise = false
# Remove the fixed borders of the 2560x1440 remaster, then account for
# H40 PAR 32:35. Trim two output rows at each edge to form a 40x23 tile grid.
master_filter = "setsar=1,crop=2224:1424:174:8,scale=320:188:flags=area,crop=320:184:0:2,setsar=1"
raw_filter = "setsar=1,crop=2224:1424:174:8,scale=320:188:flags=area,crop=320:184:0:2,setsar=1"

[output]
directory = "tmpfs/sewer_shark_intro_hd_H40_320x184_adpcm22/sim"
reuse = false
emit_decisions = true

[encoder]
# Existing 15 fps playback baseline; qualify this source through its HUD gate.
cold_cap = 380

[palette]
algorithm = "mosaic-gm"

[analysis]
source_canvas = [320, 184]
source_par = [32, 35]

