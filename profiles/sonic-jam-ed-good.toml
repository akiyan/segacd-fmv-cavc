schema_version = 4

[source]
path = "assets/SonicJamEdGood.avi"
fps = "30"
duration = "104.933333"
sar = "32:35"
# Loudness-match the quiet source master to Bad Apple's level
# (measured mono I=-16.68 LUFS; gain into tanh soft clip and a
# -1 dB limiter lands near -10 LUFS integrated).
audio_filter = "aformat=channel_layouts=mono,volume=9.7dB,asoftclip=type=tanh,alimiter=limit=0.891:attack=5:release=100:level=false"

[video]
mode = "H40"
width = 288
height = 200
fit = "pad"
master_denoise = false
# Preserve the qualified Sonic Jam source-dither removal. The codec's normal
# position-fixed Bayer output dither remains enabled.
master_filter = "setsar=1,guided=radius=1:eps=0.002:planes=15"
raw_filter = "setsar=1"

[output]
directory = "tmpfs/SonicJamEdGood_H40_288x200_adpcm22_cold210/sim"
reuse = false
emit_decisions = true

[encoder]
cold_cap = 210

[palette]
algorithm = "mosaic-gm"

[analysis]
source_canvas = [320, 224]
