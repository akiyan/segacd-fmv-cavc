schema_version = 5

[source]
path = "assets/sonic-jam-op/original-sonic-jam-op.avi"
fps = "30"
duration = "90.466667"
sar = "32:35"
# Loudness-match the quiet source master to Bad Apple's level
# (measured mono I=-15.15 LUFS; gain into tanh soft clip and a
# -1 dB limiter lands near -12 LUFS integrated).
audio_filter = "aformat=channel_layouts=mono,volume=6.2dB,asoftclip=type=tanh,alimiter=limit=0.891:attack=5:release=100:level=false"

[video]
width = 288
height = 200
fit = "pad"
master_denoise = false
# Preserve the qualified Sonic Jam source-dither removal. The codec's normal
# position-fixed Bayer output dither remains enabled.
master_filter = "setsar=1,guided=radius=1:eps=0.002:planes=15"
raw_filter = "setsar=1"

[output]
directory = "tmpfs/SonicJamOp_H40_288x200_adpcm22_cold210/sim"
reuse = false
emit_decisions = true

[encoder]
cold_cap = 210

[palette]
algorithm = "mosaic-gm"

[analysis]
source_canvas = [320, 224]
# Still, silent seconds held after the picture ends, so YouTube's end screen
# has room for its cards. The last frame is not faded; it stays readable.
tail_seconds = 5.0

[comparison]
# Text drawn on the comparison frame. The geometry itself lives in
# tools/comparison_layout.py; only the wording is a per-source choice.
# One headline: the space a second and third line would take goes to the
# playback panel instead. Keep badge and title inside the canvas minus both
# margins. The badge is drawn first, in an accent colour.
badge = "CAVC"
title = "CUSTOM SEGA CD FMV CODEC DEMO — Sonic Jam Opening at 288×200, 30 FPS"
# The real-hardware capture carries the run-up - its console, its BIOS screen,
# its button press - and the codec playback takes over the moment its own panel
# starts. The frame does not state this: the description does, and the height
# the note took goes to the panels instead.
audio_panel = "emu"
audio_intro_panel = "real"
audio_note = false
output = "videos/sonic-jam-op/comparison.mp4"
duration = 124.9
# Still, silent seconds held after the picture ends, so YouTube's end screen
# has room for its cards. The last frame is not faded; it stays readable.
tail_seconds = 5.0

# Panels are drawn in the order written here. `slot` places one in the frame:
# main is the left column, top_left and top_right share the right column's
# upper row, lower sits beneath them.
#
# `aperture` and `pixel_aspect` size the panel: an H40 screen is 320x224 with
# pixel aspect 32:35, displayed 1.3061 wide-to-high.
#
# `fmv_start` is where the moving picture begins inside that panel's own file
# and `lead` is how much of the run-up before it stays on the timeline. The
# largest lead becomes the moment every panel starts moving together.

[comparison.panels.emu]
# Names the codec and says this is an emulator running it, so the panel is
# not mistaken for a capture off real hardware - that is the panel below.
# "Custom" matches the headline, and leaves "Original" to mean the Saturn
# master alone rather than naming two different things on one frame.
label = "Custom FMV Codec Playback — SEGA-CD Emulator (Genesis Plus GX)"
# The audio note reads as a sentence, so it uses this instead.
short_label = "the codec playback panel"
slot = "main"
aperture = [320, 224]
pixel_aspect = [32, 35]
# Same shape as the Sega CD panel's spec: the encoded raster inside the
# screen it is displayed in, then the timing.
# Second line: what the disc actually has to sustain, and how big the whole
# image is. Both belong to this encode, so re-check them after re-encoding.
spec = ["288×200 movie in 320×224 (H40) screen  •  30 FPS  •  22.05 kHz mono ADPCM",
        "148 KiB/s off a single-speed CD  •  14.3 MiB disc image"]
path = "assets/sonic-jam-op/sonic-jam-op_e190_release_emu.mp4"
# Measured by correlating this recording's scene cuts against the source
# master: three cuts agree on 15.415 to the millisecond. That is 0.283 s later
# than the 15.132 s black-end, because frame 0 is flipped up and then held
# while the player waits for the first timed slot to prove CD service. The
# picture only starts advancing at frame 1, so aligning the other panels to the
# black-end would run them early.
fmv_start = 15.415
lead = 15.415

[comparison.panels.saturn]
label = "Saturn Original"
slot = "top_left"
aperture = [320, 224]
pixel_aspect = [32, 35]
# Two lines, stating the master exactly as the analysis upload does.
spec = ["Sonic Jam (Sega Saturn, 1997)",
        "288×200  •  30 FPS  •  44.1 kHz stereo"]
path = "assets/sonic-jam-op/original-sonic-jam-op.avi"
# 288x200 placed at the encode's own grid offset inside the aperture, so this
# panel and the encode share one framing. The fill is black rather than the
# frame backdrop, which would otherwise show through as grey.
pad = [320, 224, 16, 8]
# Stored at exactly 30.000, but a Sega CD displays 30 fps content on the NTSC
# 29.97 cadence, so the encode's picture advances at 30000/1001. Re-timing the
# master to that rate keeps it locked for the whole clip instead of drifting
# 0.09 s by the end, and lands it on the 59.94 output grid as an exact 2:1
# duplication rather than an occasional 3-frame hold.
input_fps = "30000/1001"
# The master is nothing but the movie.
fmv_start = 0.0
lead = 0.0

[comparison.panels.segacd]
label = "Sega CD ver."
slot = "top_right"
# The 1993 release fills the aperture, wallpaper border included; the spec
# states the moving picture inside that border.
aperture = [320, 224]
pixel_aspect = [32, 35]
# Two lines: the whole screen, then the moving picture inside its
# wallpaper border. The 256x112 movie area is measured from the
# recording, not read off a box.
# Sonic CD is a September 1993 Mega-CD release. The screen it sits in is the
# same 320x224 the panel above states, so naming it again bought nothing and
# cost the width the channel count needed.
spec = ["Sonic CD (1993)  •  256×112 movie",
        "8 FPS  •  32.7 kHz mono"]
path = "assets/sonic-jam-op/segacd-sonic-op-lossless.mkv"
# Measured. This release animates from its first visible frame, so unlike the
# encode's held frame 0 the black-end is also where it starts moving.
fmv_start = 67.487
# Same run-up as the encode, so both boot sequences play from t=0.
lead = 15.415

[comparison.panels.real]
label = "Real hardware"
slot = "lower"
# Captured from the console into a 16:9 frame, so this is the one panel that is
# not an H40 aperture.
aperture = [16, 9]
pixel_aspect = [1, 1]
spec = "Mega Drive 2  •  Mega CD 2"
path = "assets/sonic-jam-op/GX010170.MP4"
# Measured in two passes. The capture's audio cross-correlates against the
# emulator recording at a 19.026 s offset, but aligning on that ran this panel
# 83 ms (5 frames) ahead: the television delays its own sound relative to its
# picture, so an audio match hands that delay straight to the video. Comparing
# the two panels' luminance inside the rendered frame put the residual at
# lag -5, and 34.441 - 0.083 removes it. The sign matters: raising fmv_start
# raises picture_start with it, which moves the other panels later and widens
# this panel's lead rather than closing it.
#
# The screen lights up earlier still, at 33.934 s, because real hardware holds
# frame 0 for 0.507 s against the emulator's 0.283 s while it waits for the
# first timed sector slot. This panel is therefore aligned on the moment the
# picture starts moving, not on the moment it stops being black.
fmv_start = 34.358
# The whole capture is kept, so it opens the video: the console, the BIOS
# screen and the button press play before any other panel starts.
lead = 34.358

[comparison.youtube]
# The upload text for the comparison video. The wording is per-source, so it
# lives here rather than in a shared template, but every figure stays a
# placeholder that tools/youtube_description.py fills from the encode that
# produced the video - nothing numeric is retyped here.
title = "Sega CD FMV at 30 FPS — Sonic Jam Opening (288×200) Side-by-Side Comparison"
description_en = """
I built a video codec for the Sega CD. The Sega CD Constraint-Aware Video Codec plays full motion video on unmodified Sega CD / Mega-CD hardware: the console decodes and displays every frame itself while reading one single-speed CD, with no extra chip. This video puts that codec beside the material it was made from, beside what a commercial Sega CD full motion video of the era actually looked like, and beside the same disc running on real Mega Drive 2 / Mega CD 2 hardware, all playing at once.

Output: display mode H40, {width}x{height} raster ({cols}x{rows} tile grid, {cells} tiles) centered in the 320x224 aperture; {fps} fps; 22.05 kHz mono IMA ADPCM decoded by the Sub CPU. Palette (CRAM) switches: {cram_switches} ({cram_segments} segments). Useful BODY delivery about {band} KiB/s against the CD 1x ceiling of 150 KiB/s. Spare console RAM is used as prefetch buffers.

Source: {source_label}.

The run-up is heard from the real-hardware capture, recorded in the room with the console. Once the codec playback panel starts, the audio hands over to that panel's own output, so from there on you hear the Sub CPU's ADPCM decode. The other panels stay silent throughout.

What the encoder does. Tiles already resident in VRAM are reused whenever an exact or close-enough match is on hand, and those cost no CD delivery at all. A cell that cannot afford its exact pattern is pointed at a resident one for two bytes instead of a 32-byte pattern. New patterns come from one of several prefetch buffers in the console's spare RAM, each arriving by an exact per-frame deadline tied to the CD's own sector rate, so the picture never runs ahead of what the drive can physically deliver. Palettes are trained per segment.
"""
description_ja = """
Sega CD向けにvideo codecを自作しました。Sega CD Constraint-Aware Video Codec は、無改造の Sega CD / Mega-CD でfull motion videoを再生します。追加chipを使わず、単速CDを読みながら本体自身が毎frameをdecodeして表示します。この動画では、そのcodecの出力を、元にした素材、当時のSega CDの市販full motion videoが実際にどう見えたか、そして同じdiscを実機のMega Drive 2 / Mega CD 2で動かした様子と並べて同時に再生します。

出力: display mode H40、{width}x{height} raster ({cols}x{rows} tile grid、{cells} tiles)を320x224 aperture中央へ配置。{fps} fps。音声はSub CPUがdecodeする22.05 kHz mono IMA ADPCM。Palette (CRAM) switchは{cram_switches}回 ({cram_segments} segments)。有効BODY配送は約{band} KiB/sで、CD 1xの上限は150 KiB/s。本体の空きRAMを先読みバッファとして使用します。

Source: {source_label_ja}。

冒頭の助走部分の音は実機撮影の音声で、本体と同じ部屋で録ったものです。codec playback panelが始まると音声はそのpanelの出力へ引き継がれ、そこから聞こえるのはSub CPUのADPCM decodeです。他のpanelは終始無音です。

encoderの動作。VRAMに常駐しているtileは、完全一致か十分近いものがあれば再利用し、CD配送を一切使いません。正確なpatternを賄えないcellは、32 byteのpatternではなく2 byteで常駐patternへ向けます。新しいpatternは、本体の空きRAMに置いた複数の先読みbufferのいずれかから、CDのsector rateに結び付いたframeごとの正確な期限に届きます。そのため絵がdriveの物理的な配送能力を先回りすることはありません。paletteはsegmentごとに学習します。
"""

# Links, in the order they are written. They are emitted at the end of the
# English half, where YOUTUBE.md requires every URL to sit.
[comparison.youtube.links]
"Encoder decisions visualized" = "https://youtu.be/7LEBx-zyobg"
"Playback recording of this encode" = "https://youtu.be/4bQNKx4mYTI"
"Project" = "https://github.com/akiyan/segacd-fmv-cavc"

[youtube]
analysis_title = "Sega CD FMV at 30 FPS — Sonic Jam Opening (288×200) Visual Analysis & Encoding Breakdown"
playback_title = "Sega CD FMV at 30 FPS — Sonic Jam Opening (288×200) in Genesis Plus GX"
