schema_version = 4

[source]
path = "assets/machi_op.mp4"
fps = "15"
duration = "152.866667"
sar = "32:35"
# Loudness-match the quiet source master to Bad Apple's level
# (measured mono I=-15.76 LUFS; gain into tanh soft clip and a
# -1 dB limiter lands near -7 LUFS integrated).
audio_filter = "aformat=channel_layouts=mono,volume=11.8dB,asoftclip=type=tanh,alimiter=limit=0.891:attack=5:release=100:level=false"

[video]
mode = "H40"
width = 320
height = 152
fit = "crop"
master_denoise = false
master_filter = "setsar=1,crop=320:152:0:34"
raw_filter = "setsar=1,crop=320:152:0:34"

[output]
directory = "tmpfs/machi_op_H40_320x152_adpcm22/sim"
reuse = false
emit_decisions = true

[encoder]
cold_cap = 480

[palette]
algorithm = "mosaic-gm"
