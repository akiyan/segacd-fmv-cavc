schema_version = 5

[source]
path = "assets/sakura-taisen-3-op.mp4"
fps = "30"
duration = "102.524400"
sar = "1:1"
# Loudness-match the quiet source master to Bad Apple's level
# (measured mono I=-22.56 LUFS; gain into tanh soft clip and a
# -1 dB limiter lands near -12 LUFS integrated).
audio_filter = "aformat=channel_layouts=mono,volume=13.6dB,asoftclip=type=tanh,alimiter=limit=0.891:attack=5:release=100:level=false"

[video]
width = 320
height = 224
fit = "pad"
master_filter = "setsar=1,crop=640:376:0:52,scale=1280:752:flags=lanczos,hqdn3d=6:6:8:8,gblur=sigma=1.6,scale=320:172:flags=lanczos,pad=320:224:0:26:color=black,setsar=1"
raw_filter = "setsar=1,crop=640:376:0:52,scale=320:172:flags=lanczos,pad=320:224:0:26:color=black,setsar=1"

[output]
directory = "tmpfs/sakura-taisen-3-op_H40_320x224_adpcm22/sim"
reuse = false
emit_decisions = true

[encoder]
cold_cap = 200

[palette]
algorithm = "mosaic-gm"

[analysis]
# raw/ already holds the encode's own 320x224 raster, so the Source panel is
# displayed with the console's pixels rather than the master's square ones.
# Without this the panel is drawn at 320/224 = 1.4286 instead of the 1.3061
# the hardware shows. The letterbox bars the picture sits between are part of
# that raster, so the panel shows them too - that is what the console outputs.
source_canvas = [320, 224]
source_par = [32, 35]
# Still, silent seconds held after the picture ends, so YouTube's end screen
# has room for its cards. The last frame is not faded; it stays readable.
tail_seconds = 5.0

[youtube]
analysis_title = "Sega CD FMV at 30 FPS — Sakura Taisen 3 (320×224) Visual Analysis & Encoding Breakdown"
playback_title = "Sega CD FMV at 30 FPS — Sakura Taisen 3 (320×224) in Genesis Plus GX"
# The master's own specification, not the encode's: a 4:3 capture whose picture
# is a fixed 640x376 letterbox, carried at 59.94 fps. The encode displays every
# second frame, which the title states as 30 FPS. Which console the capture came
# from is not established, so no platform or year is claimed here - the source
# link below is the citation.
source_label = "Sakura Taisen 3: Is Paris Burning? opening, 640x480, 60 fps, 48 kHz stereo"
source_label_ja = "サクラ大戦3 〜巴里は燃えているか〜 オープニング、640x480、60 fps、48 kHz stereo"
# Where the master came from. It is emitted on its own line in the
# English half only, because a URL is not language specific and a
# sentence's full stop glued to one makes it the wrong link.
source_url = "https://www.youtube.com/watch?v=EOOUuCFScHI"
