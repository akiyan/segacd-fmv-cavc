schema_version = 4

[source]
path = "assets/machi_ed.mp4"
fps = "15"
duration = "266.533333"
sar = "32:35"
# Loudness-match the quiet source master to Bad Apple's level
# (measured mono I=-16.48 LUFS; gain into tanh soft clip and a
# -1 dB limiter lands near -12 LUFS integrated).
audio_filter = "aformat=channel_layouts=mono,volume=7.5dB,asoftclip=type=tanh,alimiter=limit=0.891:attack=5:release=100:level=false"

[video]
mode = "H40"
width = 320
height = 224
fit = "pad"
master_denoise = false

[output]
directory = "tmpfs/machi_ed_H40_320x224_adpcm22/sim"
reuse = false
emit_decisions = true

[encoder]
cold_cap = 380

[palette]
algorithm = "mosaic-gm"
